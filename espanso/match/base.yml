# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # Uppercase the clipboard. Copy the text first, then type ;;upper
  # Use this one for pasted text: espanso cannot see a Ctrl+V, only keystrokes.
  - trigger: ";;upper"
    replace: "{{upper}}"
    vars:
      - name: upper
        type: shell
        params:
          cmd: "wl-paste --no-newline | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().upper())'"

  # Sentence case the clipboard. Copy the text first, then type ;;sent
  # CACHE PERSISTENTE NOS ASSETS - CLOUDFLARE -> Cache persistente nos assets cloudflare
  - trigger: ";;sent"
    replace: "{{sentence}}"
    vars:
      - name: sentence
        type: shell
        params:
          cmd: "wl-paste --no-newline | python3 ~/.config/espanso/scripts/sentence_case.py"

  # Uppercase text typed inline: ;;caps(some text) -> SOME TEXT
  # Separate trigger because a bare ";;uper" would fire before you could type the text.
  - regex: ';;caps\((?P<text>.*?)\)'
    replace: "{{upper}}"
    vars:
      - name: upper
        type: shell
        params:
          cmd: "printf '%s' \"$ESPANSO_TEXT\" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().upper())'"

  # Simple text replacement
  - trigger: ":espanso"
    replace: "Hi there!"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # But matches can also be dynamic:

  # Print the current date
  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%m/%d/%Y"

  # Print the output of a shell command
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # And much more! For more information, visit the docs: https://espanso.org/docs/
